{
    tools: [ gcc, iar, llvm ],
    supportedOS: [ tirtos7, freertos, nortos ],
    boards: [
        all_cc13xx_cc26xx,
        all_cc13x4_cc26x4,
        all_lpf3,
        all_wff3,
    ],

    configurations: [
        'standard',
        {
            name: 'tfm_enabled',
            boards: [all_cc27xx],
        },
    ],

    fileLists: {
        all: [
            # Test source files
            { path: "[TEST]/src/testcase_spi_general.c" },
            { path: "[TEST]/src/testcase_spi_common.c" },
            { path: "[TEST]/src/spi.syscfg" },

            # Top-level drivers
            { path: "[DRIVERS]/source/ti/drivers/SPI.c", targetDirectory: drivers, coverage: true },
        ],
        ~tfm_enabled: [
            { path: "[TEST]/src/spi.syscfg" },
        ],
        tfm_enabled: [
            { path: "[TEST]/src/spi_ns.syscfg" },
        ],
        # Device-specific drivers below
        all_cc13x2_cc26x2: [
            { path: "[DRIVERS]/source/ti/drivers/spi/SPICC26X2DMA.c", targetDirectory: drivers, coverage: true },
            { path: "[TEST]/src/testcase_spi.c" },
        ],
        all_cc13x1_cc26x1: [
            { path: "[DRIVERS]/source/ti/drivers/spi/SPICC26X2DMA.c", targetDirectory: drivers, coverage: true },
            { path: "[TEST]/src/testcase_spi.c" },
        ],
        all_cc13x4_cc26x4: [
            { path: "[DRIVERS]/source/ti/drivers/spi/SPICC26X4DMA.c", targetDirectory: drivers, coverage: true },
            { path: "[TEST]/src/testcase_spi.c" },
        ],
        all_lpf3: [
            { path: "[DRIVERS]/source/ti/drivers/spi/SPILPF3DMA.c", targetDirectory: drivers, coverage: true },
            { path: "[TEST]/src/testcase_spi.c" },
        ],
        all_wff3: [
            { path: "[DRIVERS]/source/ti/drivers/spi/SPIWFF3DMA.c", targetDirectory: drivers, coverage: true },
            { path: "[TEST]/src/testcase_spi.c" },
        ],
    },
}
